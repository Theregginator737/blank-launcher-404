<!DOCTYPE html>
<html>
<head>
  <title>Google</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      gap: 14px;
    }
    .box {
      display: flex;
      gap: 8px;
    }
    input {
      padding: 10px 14px;
      width: 280px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #1a73e8;
      color: white;
    }
    button:hover {
      background-color: #1557b0;
    }
    .presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preset-btn {
      background-color: #e8eaed;
      color: #202124;
      font-size: 13px;
      padding: 7px 12px;
    }
    .preset-btn:hover {
      background-color: #dadce0;
    }
  </style>
</head>
<body>

  <div class="box">
    <input type="text" id="urlInput" value="https://mojeek.com" placeholder="https://example.com">
    <button onclick="launch()">Open in about:blank</button>
  </div>

  <div class="presets">
    <button class="preset-btn" onclick="openPreset('https://mojeek.com')">Mojeek Search</button>
    <button class="preset-btn" onclick="openPreset('https://duckduckgo.com')">DuckDuckGo (Lite)</button>
    <button class="preset-btn" onclick="openPreset('https://wikipedia.org')">Wikipedia</button>
    <button class="preset-btn" onclick="openPreset('https://wiby.me')">Wiby Search</button>
  </div>

  <script>
    function openPreset(presetUrl) {
      document.getElementById('urlInput').value = presetUrl;
      launch();
    }

    function launch() {
      var url = document.getElementById('urlInput').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      var win = window.open('about:blank', '_blank');
      if (win) {
        win.document.title = 'Google';
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        var iframe = win.document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.src = url;
        win.document.body.appendChild(iframe);
      } else {
        alert('Pop-up blocked! Click the pop-up icon in your address bar and allow pop-ups for this site.');
      }
    }
  </script>

</body>
</html>
